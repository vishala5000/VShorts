name: Build and Auto-Sign APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Unsigned Release APK
      run: ./gradlew assembleRelease

    - name: Generate Debug Keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Zipalign APK (CRITICAL FOR VALID SIGNATURE)
      run: |
        $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk

    - name: Sign APK with apksigner
      run: |
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
          --ks debug.keystore \
          --ks-pass pass:android \
          --key-pass pass:android \
          --ks-key-alias androiddebugkey \
          --out app-release-signed.apk \
          app-release-aligned.apk

    - name: Verify APK Signature
      run: |
        $ANDROID_HOME/build-tools/34.0.0/apksigner verify app-release-signed.apk

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: VShorts-Signed-Release.apk
        path: app-release-signed.apk